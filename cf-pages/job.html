<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ジョブ詳細 - phaino_ai</title>
<style>
/* phaino_ai - Web UI スタイル */

:root {
  --bg: #0d1117;
  --surface: #161b22;
  --surface2: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --text-muted: #8b949e;
  --accent: #58a6ff;
  --accent-hover: #79c0ff;
  --danger: #f85149;
  --success: #3fb950;
  --warning: #d29922;
  --pending: #a371f7;
  --radius: 8px;
  --font: "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "Cascadia Code", "Consolas", "Monaco", monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.6;
  min-height: 100vh;
}

a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-hover); }

/* ===========================
   Header
   =========================== */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}
.header-inner {
  max-width: 1100px;
  margin: 0 auto;
  padding: 14px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.logo {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.5px;
}
.subtitle {
  color: var(--text-muted);
  font-size: 13px;
}
.runpod-badge {
  margin-left: auto;
  font-size: 12px;
  padding: 4px 10px;
  border-radius: 20px;
  background: var(--surface2);
  border: 1px solid var(--border);
}
.runpod-badge.status-running { color: var(--success); border-color: var(--success); }
.runpod-badge.status-pending { color: var(--pending); border-color: var(--pending); }
.runpod-badge.status-idle    { color: var(--text-muted); }
.runpod-badge.status-error   { color: var(--danger); border-color: var(--danger); }

/* ===========================
   Layout
   =========================== */
.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
}
.card h2 {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 20px;
  color: var(--text);
}
.card h3 {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 16px;
}

/* ===========================
   Tabs
   =========================== */
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0;
}
.tab {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  padding: 8px 16px;
  margin-bottom: -1px;
  transition: color 0.15s, border-color 0.15s;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.tab-content { display: none; }
.tab-content.active { display: block; }

/* ===========================
   Forms
   =========================== */
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.form-group input[type="url"],
.form-group input[type="text"] {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 13px;
  padding: 10px 12px;
  outline: none;
  transition: border-color 0.15s;
}
.form-group input:focus { border-color: var(--accent); }

.form-options {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-items: center;
  margin-bottom: 20px;
  padding: 12px 16px;
  background: var(--surface2);
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
.form-options label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
}
.form-options select {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-size: 12px;
  padding: 3px 6px;
  margin-left: 4px;
}

/* Drop zone */
.drop-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  padding: 40px 20px;
  text-align: center;
  cursor: pointer;
  color: var(--text-muted);
  transition: border-color 0.15s, background 0.15s;
}
.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--accent);
  background: rgba(88,166,255,0.05);
}
.drop-zone input[type="file"] { display: none; }
.file-selected {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 16px;
  font-size: 13px;
}

/* ===========================
   Buttons
   =========================== */
.btn-primary {
  background: var(--accent);
  border: none;
  border-radius: var(--radius);
  color: #000;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  padding: 10px 20px;
  transition: background 0.15s;
}
.btn-primary:hover { background: var(--accent-hover); }

.btn-danger {
  background: transparent;
  border: 1px solid var(--danger);
  border-radius: var(--radius);
  color: var(--danger);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 16px;
  transition: background 0.15s;
}
.btn-danger:hover { background: rgba(248,81,73,0.1); }

.btn-small {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  font-size: 12px;
  padding: 4px 10px;
}
.btn-small:hover { border-color: var(--accent); color: var(--accent); }

/* ===========================
   Badges
   =========================== */
.badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.badge-type     { background: rgba(88,166,255,0.1); color: var(--accent); border: 1px solid rgba(88,166,255,0.3); }
.badge-queued   { background: rgba(163,113,247,0.1); color: var(--pending); border: 1px solid rgba(163,113,247,0.3); }
.badge-running  { background: rgba(210,153,34,0.1); color: var(--warning); border: 1px solid rgba(210,153,34,0.3); }
.badge-done     { background: rgba(63,185,80,0.1); color: var(--success); border: 1px solid rgba(63,185,80,0.3); }
.badge-error    { background: rgba(248,81,73,0.1); color: var(--danger); border: 1px solid rgba(248,81,73,0.3); }
.badge-cancelled { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
.badge-disabled { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); font-size: 11px; padding: 2px 8px; border-radius: 20px; }

/* ===========================
   Job Table
   =========================== */
.job-table {
  width: 100%;
  border-collapse: collapse;
}
.job-table th {
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
}
.job-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.job-table tr:last-child td { border-bottom: none; }
.job-table tr:hover td { background: rgba(255,255,255,0.02); }

.target-cell {
  max-width: 280px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-family: var(--font-mono);
  font-size: 12px;
}
.time-cell { color: var(--text-muted); font-size: 12px; white-space: nowrap; }
.result-mini { font-size: 12px; color: var(--text-muted); }
.empty { text-align: center; color: var(--text-muted); padding: 40px; }

/* ===========================
   Job Detail
   =========================== */
.job-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  flex-wrap: wrap;
}
.target-title {
  font-size: 15px;
  font-weight: 600;
  font-family: var(--font-mono);
  word-break: break-all;
  margin-bottom: 8px;
}
.job-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.job-actions { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
.options-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  padding-top: 12px;
  margin-top: 12px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-muted);
}

/* Summary grid */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 16px;
}
.summary-item {
  text-align: center;
  padding: 16px;
  background: var(--surface2);
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
.summary-num {
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
}
.summary-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.summary-confirmed .summary-num { color: var(--success); }
.summary-practical .summary-num { color: var(--warning); }
.summary-reported .summary-num  { color: var(--accent); }

/* Log box */
.log-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.log-header label {
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}
.log-box {
  background: #010409;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: #7ee787;
  font-family: var(--font-mono);
  font-size: 12px;
  line-height: 1.7;
  max-height: 600px;
  overflow-y: auto;
  padding: 16px;
  white-space: pre-wrap;
  word-break: break-word;
}

/* ===========================
   Overlay
   =========================== */
.submitting-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 999;
  gap: 16px;
  color: var(--text);
}
.spinner {
  width: 40px;
  height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===========================
   Responsive
   =========================== */
@media (max-width: 640px) {
  .container { padding: 16px; }
  .card { padding: 16px; }
  .form-options { flex-direction: column; align-items: flex-start; }
  .header-inner { flex-wrap: wrap; }
  .job-table { font-size: 12px; }
  .job-table th:nth-child(4),
  .job-table td:nth-child(4) { display: none; }
}

</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <a href="/" class="logo">⚡ phaino_ai</a>
    <span class="subtitle">ジョブ詳細</span>
  </div>
</header>

<main class="container">
  <section class="card">
    <div class="job-header">
      <div>
        <h2 class="target-title" id="target-title">読み込み中...</h2>
        <div class="job-meta">
          <span class="badge badge-type" id="target-type"></span>
          <span class="badge" id="status-badge"></span>
          <span class="time-cell" id="created-at"></span>
        </div>
      </div>
      <div class="job-actions">
        <button class="btn-danger" id="cancel-btn" onclick="cancelJob()" style="display:none">キャンセル</button>
        <button class="btn-secondary" id="finalize-btn" onclick="finalizeJob()" style="display:none">⏹ 途中終了してレポート生成</button>
        <a href="#" id="report-link" class="btn-primary" download style="display:none">📄 レポートDL</a>
        <a href="#" id="uncertain-link" class="btn-secondary" download style="display:none">⚠️ 曖昧レポートDL</a>
      </div>
    </div>

    <!-- リアルタイム候補数 -->
    <div id="live-vuln-box" style="display:none; margin-top:8px; padding:8px 12px; background:var(--surface2); border-radius:6px; font-size:0.85rem;">
      現在の脆弱性候補: <span id="live-vuln-count" style="color:var(--accent); font-weight:bold;">0</span> 件
    </div>

    <!-- オプション -->
    <div class="options-row" id="options-box"></div>
  </section>

  <!-- 結果サマリー -->
  <section class="card" id="summary-card" style="display:none">
    <h3>スキャン結果</h3>
    <div class="summary-grid">
      <div class="summary-item"><div class="summary-num" id="s-files">-</div><div class="summary-label">ファイル</div></div>
      <div class="summary-item"><div class="summary-num" id="s-functions">-</div><div class="summary-label">解析関数</div></div>
      <div class="summary-item"><div class="summary-num" id="s-total">-</div><div class="summary-label">脆弱性候補</div></div>
      <div class="summary-item summary-reported"><div class="summary-num" id="s-reported">-</div><div class="summary-label">報告対象</div></div>
      <div class="summary-item summary-confirmed"><div class="summary-num" id="s-confirmed">-</div><div class="summary-label">✅ confirmed</div></div>
      <div class="summary-item summary-practical"><div class="summary-num" id="s-practical">-</div><div class="summary-label">⚠️ practical</div></div>
    </div>
  </section>

  <!-- ライブログ -->
  <section class="card">
    <div class="log-header">
      <h3>実行ログ</h3>
      <label>
        <input type="checkbox" id="autoscroll" checked> 自動スクロール
      </label>
    </div>
    <div id="progress-box" style="display:none; margin-bottom:12px;">
      <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
        <span id="progress-label" style="font-size:13px; color:var(--text-muted);">LLM解析中...</span>
        <span id="progress-pct" style="font-size:13px; color:var(--accent);">0%</span>
      </div>
      <div style="background:var(--surface2); border-radius:4px; height:8px; overflow:hidden;">
        <div id="progress-bar" style="height:100%; background:var(--accent); width:0%; transition:width 0.3s;"></div>
      </div>
    </div>
    <pre class="log-box" id="log-box">（ログなし）</pre>
  </section>
</main>

<script>
const params = new URLSearchParams(window.location.search);
const JOB_ID = params.get("job_id") || window.location.pathname.split("/").pop();
let INITIAL_STATUS = "running";

let _metricsInterval = null;
function startMetricsPolling() {
  if (_metricsInterval || !window._vllmMetricsUrl) return;
  _metricsInterval = setInterval(async () => {
    try {
      const resp = await fetch(window._vllmMetricsUrl);
      const text = await resp.text();
      let done = 0;
      for (const line of text.split("\n")) {
        if (line.includes("vllm:request_success_total") && !line.startsWith("#")) {
          const m = line.match(/finished_reason="(stop|length)".*?}\s+([\d.]+)/);
          if (m) done += parseFloat(m[2]);
        }
      }
      const total = window._vllmTotal || 0;
      if (total > 0) {
        const pct = Math.min(100, Math.round(done / total * 100));
        document.getElementById("progress-box").style.display = "";
        document.getElementById("progress-bar").style.width = pct + "%";
        document.getElementById("progress-pct").textContent = pct + "%";
        document.getElementById("progress-label").textContent = `vLLM完了: ${Math.round(done)}/${total} | ${pct}%`;
      }
      if (INITIAL_STATUS === "done" && _metricsInterval) {
        clearInterval(_metricsInterval);
        _metricsInterval = null;
      }
    } catch(e) {}
  }, 3000);
}

async function loadJob() {
  const resp = await fetch(`https://api.phaino-ai.com/api/job/${JOB_ID}`);
  if (!resp.ok) return;
  const job = await resp.json();
  INITIAL_STATUS = job.status;
  document.getElementById("target-title").textContent = job.target_display || "";
  document.getElementById("target-title").title = job.target_display || "";
  document.getElementById("target-type").textContent = job.target_type || "";
  const sb = document.getElementById("status-badge");
  sb.textContent = job.status;
  sb.className = `badge badge-${job.status}`;
  document.getElementById("created-at").textContent = (job.created_at || "").slice(0,16).replace("T"," ") + " UTC";
  const rl = document.getElementById("report-link");
  if (job.status === "done") {
    rl.href = `https://api.phaino-ai.com/api/job/${job.id}/report`;
    rl.style.display = "";
    const ul = document.getElementById("uncertain-link");
    ul.href = `https://api.phaino-ai.com/api/job/${job.id}/report/uncertain`;
    ul.style.display = "";
  }
  if (job.options) {
    let html = `<span>min_exploitability: <strong>${job.options.min_exploitability}</strong></span>`;
    if (job.options.no_codeql) html += `<span class="badge-disabled">CodeQL無効</span>`;
    if (job.options.no_docker) html += `<span class="badge-disabled">Docker無効</span>`;
    if (job.options.no_react) html += `<span class="badge-disabled">ReAct無効</span>`;
    document.getElementById("options-box").innerHTML = html;
  }
  if (job.result_summary) {
    const s = job.result_summary;
    document.getElementById("s-files").textContent = s.files ?? "-";
    document.getElementById("s-functions").textContent = s.functions ?? "-";
    document.getElementById("s-total").textContent = s.total_vulns ?? "-";
    document.getElementById("s-reported").textContent = s.reported ?? "-";
    document.getElementById("s-confirmed").textContent = s.confirmed ?? "-";
    document.getElementById("s-practical").textContent = s.practical ?? "-";
    document.getElementById("summary-card").style.display = "";
  }
  if (job.log) {
    // LLM進捗行を除去してログ表示
    const filtered = job.log.split("\n")
      .filter(l => !l.match(/LLM: \d+\/\d+ 関数完了/))
      .join("\n");
    const box = document.getElementById("log-box");
    box.textContent = filtered;
    logOffset = job.log.length;

    // vLLM URLとtotalをログから抽出
    const urlMatch = job.log.match(/vLLM URL: (https?:\/\/[^\s]+\/v1)/);
    if (urlMatch) {
      window._vllmMetricsUrl = urlMatch[1].replace("/v1", "") + "/metrics";
      const totalMatch = job.log.match(/LLM: \d+\/(\d+)/);
      if (totalMatch) window._vllmTotal = parseInt(totalMatch[1]);
    }
  }
}
loadJob().then(() => {
  if (window._vllmMetricsUrl) startMetricsPolling();
});

// ===========================
// ライブポーリング（running/queuedのみ）
// ===========================
let logOffset = document.getElementById("log-box").textContent.length;
let polling = null;

if (["queued", "running"].includes(INITIAL_STATUS)) {
  polling = setInterval(pollLog, 2000);
  document.getElementById("cancel-btn").style.display = "";
  if (INITIAL_STATUS === "running") {
    document.getElementById("finalize-btn").style.display = "";
    document.getElementById("live-vuln-box").style.display = "";
    setInterval(pollProgress, 5000);
  }
}

async function pollProgress() {
  try {
    const resp = await fetch(`https://api.phaino-ai.com/api/job/${JOB_ID}/progress`, { credentials: "include" });
    const data = await resp.json();
    document.getElementById("live-vuln-count").textContent = data.vuln_count ?? 0;
    if (!["queued", "running"].includes(data.status)) {
      document.getElementById("live-vuln-box").style.display = "none";
      document.getElementById("finalize-btn").style.display = "none";
    }
  } catch(e) {}
}

async function pollLog() {
  try {
    const resp = await fetch(`https://api.phaino-ai.com/api/job/${JOB_ID}/log?offset=${logOffset}`, {  });
    const data = await resp.json();

    if (data.log) {
      const box = document.getElementById("log-box");
      // LLM進捗行を除去して追記
      const filtered = data.log.split("\n")
        .filter(l => !l.match(/LLM: \d+\/\d+ 関数完了/))
        .join("\n");
      box.textContent += filtered;
      logOffset = data.offset;

      // vLLM URLが新しいログに含まれてたら抽出
      if (!window._vllmMetricsUrl) {
        const urlMatch = data.log.match(/vLLM URL: (https?:\/\/[^\s]+\/v1)/);
        if (urlMatch) {
          window._vllmMetricsUrl = urlMatch[1].replace("/v1", "") + "/metrics";
          const totalMatch = data.log.match(/LLM: \d+\/(\d+)/);
          if (totalMatch) window._vllmTotal = parseInt(totalMatch[1]);
          startMetricsPolling();
        }
      }

      // プログレスバー更新
      const allLog = box.textContent;
      const matches = [...allLog.matchAll(/LLM: (\d+)\/(\d+) 関数完了 \| 脆弱性候補: (\d+)件/g)];
      if (matches.length > 0) {
        const last = matches[matches.length - 1];
        const done = parseInt(last[1]), total = parseInt(last[2]), vulns = parseInt(last[3]);
        const pct = total > 0 ? Math.round(done / total * 100) : 0;
        document.getElementById("progress-box").style.display = "";
        document.getElementById("progress-bar").style.width = pct + "%";
        document.getElementById("progress-pct").textContent = pct + "%";
        document.getElementById("progress-label").textContent = `LLM: ${done}/${total} 関数完了 | 脆弱性候補: ${vulns}件`;
      }
      if (document.getElementById("autoscroll").checked) {
        box.scrollTop = box.scrollHeight;
      }
    }

    // ステータス更新
    const badge = document.getElementById("status-badge");
    if (badge) {
      badge.textContent = data.status;
      badge.className = `badge badge-${data.status}`;
    }

    // 完了 or エラーならポーリング停止
    if (["done", "error", "cancelled"].includes(data.status)) {
      clearInterval(polling);
      polling = null;
      if (_metricsInterval) { clearInterval(_metricsInterval); _metricsInterval = null; }
      document.getElementById("cancel-btn").style.display = "none";
      // サマリー再取得
      await loadJob();
    }
  } catch(e) {
    console.error("poll error:", e);
  }
}

// ===========================
// キャンセル / 途中終了
// ===========================
async function finalizeJob() {
  if (!confirm("途中終了してここまでの候補でレポートを生成しますか？")) return;
  try {
    const resp = await fetch(`https://api.phaino-ai.com/api/job/${JOB_ID}/finalize`, { method: "POST", credentials: "include" });
    if (resp.ok) {
      document.getElementById("finalize-btn").style.display = "none";
      alert("途中終了を受け付けました。レポート生成中...");
    } else {
      const err = await resp.json();
      alert("エラー: " + (err.detail || resp.statusText));
    }
  } catch(e) {
    alert("エラー: " + e.message);
  }
}

async function cancelJob() {
  if (!confirm("このジョブをキャンセルしますか？")) return;
  try {
    const resp = await fetch(`https://api.phaino-ai.com/api/job/${JOB_ID}/cancel`, { method: "POST",  });
    if (resp.ok) {
      location.reload();
    } else {
      const err = await resp.json();
      alert("エラー: " + (err.detail || resp.statusText));
    }
  } catch(e) {
    alert("エラー: " + e.message);
  }
}
